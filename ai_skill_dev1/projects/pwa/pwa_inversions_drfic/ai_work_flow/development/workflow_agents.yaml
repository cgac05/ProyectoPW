# 🧬 Workflow de Agentes — Proyecto pwa_inversions_drfic

> Definición de tareas, responsabilidades y fases de activación para los 5 agentes en este proyecto específico.

**Versión**: 2.2  
**Fecha**: March 17, 2026  
**Proyecto**: pwa_inversions_drfic

---

## 📋 Configuración de Agentes por Fase

### FASE 2.3 — Investigación Profunda

#### 🧠 @picoro — Investigación + Análisis
**Tarea principal**: Investigar dominio de trading e inversiones

```yaml
phase: "FASE 2.3"
agent: picoro
status: "awaiting_specification"
assigned_skills:
  - ticket_analyzer
  - architecture_designer
  - requirement_validator
  - knowledge_synthesizer

tasks:
  1_analyze_spec:
    name: "Analizar SPECIFICATION.md"
    input: "projects/pwa/pwa_inversions_drfic/ai_work_flow/docs/specs/SPECIFICATION.md"
    output: "Validación de completitud"
    
  2_research_brokers:
    name: "Investigar APIs de Brokers"
    output: "knowledge/local/01_broker_api_research.md"
    topics:
      - "Interactive Brokers API (@stoqey/ib)"
      - "Alpaca API (REST + WebSocket)"
      - "Comparativa y recomendación"
    
  3_research_indicators:
    name: "Investigar librerías de indicadores"
    output: "knowledge/local/02_technical_indicators_research.md"
    topics:
      - "TA-Lib vs Talib.js vs otras"
      - "Implementación de RSI, MACD, Bollinger"
      - "Performance vs precisión"
    
  4_research_strategies:
    name: "Investigar estrategias de opciones"
    output: "knowledge/local/03_options_strategies_research.md"
    topics:
      - "Iron Condor, Straddle, Strangle"
      - "Risk management"
      - "Profit/loss calculation"
    
  5_design_architecture:
    name: "Diseñar arquitectura del proyecto"
    output: "knowledge/local/04_architecture_design.md + config.yaml"
    components:
      - "PWA components (React)"
      - "Services (TypeScript)"
      - "Database schema (Supabase)"
      - "API endpoints"
    
  6_create_tickets:
    name: "Generar tickets TKT-INVRFIC-###"
    output: "tickets/ con tareas para Goku, Krillin, etc."
```

---

### FASE 2.4 — Diseño + Estructura

#### 🗄️ @krillin — Diseño Base de Datos
**Tarea**: Diseñar schema Supabase desde contratos PWA

```yaml
phase: "FASE 2.4"
agent: krillin
status: "awaiting_specification"
assigned_skills:
  - database_schema_designer
  - database_migrator
  - database_connector

tasks:
  1_design_schema:
    name: "Traducir modelos PWA → SQL Supabase"
    input: "data/supabase/models/"
    output: "data/supabase/schema/ (SQL definitions)"
    tables:
      - "strategies (trading strategies config)"
      - "price_history (OHLCV candles)"
      - "indicators (calculated indicators)"
      - "signals (buy/sell signals)"
      - "trades (executed trades)"
      - "portfolio (user positions)"
    
  2_create_migrations:
    name: "Crear migraciones versionadas"
    output: "src/migrations/001_initial_schema.sql"
    
  3_prepare_env:
    name: "Preparar .env.example"
    output: "projects/api/rest_api_inversions_drfic/.env.example"
```

#### 👨‍💻 @goku — Estructura Base PWA
**Tarea**: Crear estructura Vite + componentes skeleton

```yaml
phase: "FASE 2.4"
agent: goku
status: "awaiting_specification"
assigned_skills:
  - vite_code_generator
  - code_structure_organizer
  - dependency_manager

tasks:
  1_setup_vite:
    name: "Configurar Vite + React + TypeScript"
    output: "vite.config.ts + tsconfig.json + package.json"
    
  2_create_structure:
    name: "Crear estructura de carpetas"
    output: "src/components/, src/features/, src/services/, etc."
    
  3_create_skeletons:
    name: "Crear componentes skeleton sin lógica"
    components:
      - "Dashboard (main page)"
      - "MarketScanner (view market)"
      - "SignalPanel (view signals)"
      - "PortfolioManager (manage positions)"
      - "BacktestEngine (historical testing)"
```

