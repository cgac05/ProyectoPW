### FASE 2.4 — Diseño Detallado + Estructura

#### 🗄️ @krillin — Diseño Base de Datos
**Tarea**: Ejecutar TKT-INVRFIC-001 (Schema Supabase) + TKT-INVRFIC-002 (MongoDB)

```yaml
phase: "FASE 2.4"
agent: krillin
status: "ready_for_sprint_1"
assigned_tickets:
  - "TKT-INVRFIC-001: PostgreSQL Schema (Supabase)"
  - "TKT-INVRFIC-002: MongoDB Collections"
  - "TKT-INVRFIC-004: IBroker Interface"
  - "TKT-INVRFIC-007: Message Queue (Bull)"

assigned_skills:
  - database_schema_designer
  - database_migrator
  - database_connector

sprint_1_deliverables:
  - "Schema PostgreSQL con 6 tables (users, accounts, trades, signals, portfolio, settings)"
  - "Supabase RLS policies"
  - "MongoDB collections con TTL indices"
  - "IBroker interface TypeScript definition"
  - "Bull queue infrastructure (Redis)"
    
  2_create_migrations:
    name: "Crear migraciones versionadas"
    output: "src/migrations/001_initial_schema.sql"
    
  3_prepare_env:
    name: "Preparar .env.example"
    output: "projects/api/rest_api_inversions_drfic/.env.example"
```

#### 👨‍💻 @goku — Estructura Base PWA
**Tarea**: Crear estructura Vite + componentes skeleton

```yaml
phase: "FASE 2.4"
agent: goku
status: "awaiting_specification"
assigned_skills:
  - vite_code_generator
  - code_structure_organizer
  - dependency_manager

tasks:
  1_setup_vite:
    name: "Configurar Vite + React + TypeScript"
    output: "vite.config.ts + tsconfig.json + package.json"
    
  2_create_structure:
    name: "Crear estructura de carpetas"
    output: "src/components/, src/features/, src/services/, etc."
    
  3_create_skeletons:
    name: "Crear componentes skeleton sin lógica"
    components:
      - "Dashboard (main page)"
      - "MarketScanner (view market)"
      - "SignalPanel (view signals)"
      - "PortfolioManager (manage positions)"
      - "BacktestEngine (historical testing)"
```

