### FASE 3 — Implementación

#### 👨‍💻 @goku — Implementación de Módulos
**Tarea**: Implementar componentes + servicios basados en tickets

```yaml
phase: "FASE 3"
agent: goku
tickets:
  - "TKT-INVRFIC-001: Setup Vite base"
  - "TKT-INVRFIC-002: Broker connector (IBKR/Alpaca)"
  - "TKT-INVRFIC-003: Technical indicators (RSI, MACD, Bollinger)"
  - "TKT-INVRFIC-004: Signal generator"
  - "TKT-INVRFIC-005: Dashboard UI"
  - "TKT-INVRFIC-006: Market scanner"
  - "TKT-INVRFIC-007: Options chain viewer"
  - "TKT-INVRFIC-008: Backtester"
  - "TKT-INVRFIC-009: Portfolio manager"
  - "TKT-INVRFIC-010: Alert system"

documentation_standard: "FIC (EN/ES) mandatory"
```

#### 🗄️ @krillin — Implementación de Persistencia
**Tarea**: Implementar servicios de BD en REST API

```yaml
phase: "FASE 3"
agent: krillin
parallel_to: goku
tasks:
  1_execute_migrations:
    name: "Ejecutar migrations en DEV Supabase"
    
  2_implement_services:
    name: "Implementar servicios de datos"
    services:
      - "StrategyService (CRUD)"
      - "PriceHistoryService (query historical)"
      - "SignalService (save/retrieve signals)"
      - "TradeService (record trades)"
      - "PortfolioService (positions)"
    
  3_expose_api:
    name: "Crear endpoints REST"
    endpoints:
      - "POST /api/strategies"
      - "GET /api/strategies/:id"
      - "GET /api/signals (filtered)"
      - "POST /api/trades"
      - "GET /api/portfolio"
```

#### 🥷 @vegeta — Optimización
**Tarea**: Optimizar performance + auditar seguridad

```yaml
phase: "FASE 3"
agent: vegeta
after_goku: true
tasks:
  - "Optimizar latencia en market data feeds"
  - "Reducir re-renders en React components"
  - "Auditar que no hay credenciales en código"
  - "Manejar secretos vía .env"
  - "Refactor duplicación de código"
```

#### 🧪 @bulma — Testing
**Tarea**: Crear tests + validar funcionalidad

```yaml
phase: "FASE 3"
agent: bulma
after_vegeta: true
tasks:
  - "Crear tests unitarios para indicadores"
  - "Crear tests de integración para broker connection"
  - "Validar signals vs histórico"
  - "Test portfolio calculations"
  - "Regression testing de features anteriores"
```

