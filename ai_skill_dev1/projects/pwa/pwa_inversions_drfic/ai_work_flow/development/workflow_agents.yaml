## 🔄 Ciclo de Fases

```
Fase 0: Setup Global      ✅ COMPLETADA
Fase 1: Agentes/Skills    ✅ COMPLETADA
Fase 2.1: SPEC            🟡 PENDIENTE → Usuario proporciona
Fase 2.2: DB Selection    🟡 PENDIENTE → Preguntar a usuario
Fase 2.3: Investigación   🟡 PENDIENTE → Picoro invocado
Fase 2.4: Diseño          🟡 PENDIENTE → Picoro + Krillin + Goku
Fase 3: Implementación    🟡 PENDIENTE → Todos los agentes
```

